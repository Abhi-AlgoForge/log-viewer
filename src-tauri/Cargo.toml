[package]
name = "log-viewer"
version = "0.1.0"
description = "Modern local-first log viewer"
authors = ["Log Viewer Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "log_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
thiserror = "2"
anyhow = "1"

memmap2 = "0.9"
memchr = "2"
notify = "8"

chrono = { version = "0.4", features = ["serde"] }
regex = "1"
aho-corasick = "1"
shell-words = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dirs = "5"
flate2 = "1"
zstd = "0.13"
bzip2 = "0.4"

# Desktop-only plugins. Single-instance funnels `log-viewer foo.log` invocations
# to the existing window; updater fetches signed releases.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
