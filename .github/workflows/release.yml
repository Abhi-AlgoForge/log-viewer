name: Release

# Fires when a v*.*.* tag is pushed. Builds Windows installers, sends them
# through SignPath for code signing (foundation tier, free for OSS), then
# attaches the signed binaries to a GitHub Release.
#
# Required secrets (set in repo Settings → Secrets and variables → Actions):
#   SIGNPATH_API_TOKEN              — created in SignPath user settings
#   SIGNPATH_ORGANIZATION_ID        — UUID of your SignPath org
#   SIGNPATH_PROJECT_SLUG           — usually "log-viewer"
#   SIGNPATH_SIGNING_POLICY_SLUG    — typically "release-signing"
#
# Before the first signed release, also install the SignPath GitHub App on
# this repo: https://github.com/apps/signpath-io

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write     # required by SignPath's signed-release verification
  actions: read

jobs:
  build-windows:
    name: Build + sign Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installers
        run: npm run tauri build

      - name: Stage installers
        id: stage
        shell: pwsh
        run: |
          $out = "unsigned-installers"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" -Destination $out
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" -Destination $out
          # Also include the bare app exe so SignPath can co-sign it inside
          # the installer (its signing policy is configured to recurse).
          Copy-Item "src-tauri/target/release/log-viewer.exe" -Destination $out
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: unsigned-installers

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: List signed artifacts
        shell: pwsh
        run: Get-ChildItem signed-installers -Recurse | Format-Table FullName, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            signed-installers/*.exe
            signed-installers/*.msi
